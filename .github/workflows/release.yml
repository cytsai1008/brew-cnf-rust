name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-linker
        if: matrix.linker != ''
        run: sudo apt-get update -q && sudo apt-get install -y ${{ matrix.linker }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure cross-linker
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf brew-cnf-${{ matrix.target }}.tar.gz brew-cnf
          mv brew-cnf-${{ matrix.target }}.tar.gz $GITHUB_WORKSPACE/

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: brew-cnf-${{ matrix.target }}.tar.gz
